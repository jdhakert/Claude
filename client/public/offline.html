<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarReady — Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f6f7f6;
        color: #14211c;
        text-align: center;
      }
      .box {
        max-width: 24rem;
        padding: 2rem;
      }
      h1 {
        color: #0b3d2e;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>
        BarReady can't reach the network right now. Your cached study data is
        still available once you reconnect.
      </p>
    </div>
  </body>
</html>
