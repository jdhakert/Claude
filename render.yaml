# Render Blueprint for BarReady (beta).
# Host: Render (https://render.com) — chosen for managed Postgres + web service +
# static site with simple IaC and zero-downtime deploys. See docs/DEPLOYMENT.md.
#
# Deploy: push to the production branch, then in Render create a Blueprint from
# this file. Fill the secrets marked `sync: false` in the dashboard.
#
# Architecture: a Fastify API web service, a Vite/PWA static site, and a managed
# Postgres database. The API runs via `tsx` (it consumes @barready/db as TS
# source — see OPS-1 in docs/POST_BETA_BACKLOG.md); a compiled start is a
# post-beta optimization.

databases:
  - name: barready-db
    databaseName: barready
    plan: basic-256mb # bump for production load
    postgresMajorVersion: "16"

services:
  # --- API (Fastify) ---
  - type: web
    name: barready-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # Install the whole workspace (frozen lockfile) — the API imports @barready/db.
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    # Apply forward-only migrations BEFORE traffic shifts to the new version.
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @barready/api start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Wired from the managed database (internal connection string).
      - key: DATABASE_URL
        fromDatabase:
          name: barready-db
          property: connectionString
      # Allow the static site origin (set to the deployed web URL).
      - key: CORS_ORIGINS
        sync: false
      # Optional: leave UNSET for safe stub billing. Set to enable live Stripe.
      - key: STRIPE_SECRET_KEY
        sync: false

  # --- Client (Vite PWA, static) ---
  - type: web
    name: barready-web
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @barready/client build
    staticPublishPath: client/dist
    autoDeploy: true
    # SPA + PWA: serve index.html for client-side routes; never cache the SW.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      # Build-time API base URL (the API service's public URL).
      - key: VITE_API_BASE_URL
        sync: false
